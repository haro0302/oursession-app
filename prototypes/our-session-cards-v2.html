<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>our-SESSION / セッションアシスト v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15151a;
  --card:rgba(26,26,32,.72);
  --card2:rgba(34,34,42,.7);
  --text:#f5f5f7;
  --text2:#9a9aa8;
  --text3:#5a5a66;
  --red:#ff2d4a;
  --red2:#ff5570;
  --line:rgba(255,255,255,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);color:var(--text);
  font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
}

/* aurora */
.aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.blob{position:absolute;border-radius:50%;filter:blur(70px);}
.b1{width:340px;height:340px;background:#3b6cff;opacity:.11;top:-90px;left:-80px;animation:d1 22s ease-in-out infinite;}
.b2{width:300px;height:300px;background:#9b4dff;opacity:.10;top:34%;right:-110px;animation:d2 26s ease-in-out infinite;}
.b3{width:320px;height:320px;background:#ff4d9b;opacity:.08;bottom:-110px;left:-40px;animation:d3 30s ease-in-out infinite;}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,60px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,-50px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-40px)}}

/* phone */
.phone{
  position:relative;z-index:1;width:100%;max-width:400px;
  height:100dvh;max-height:860px;display:flex;flex-direction:column;overflow:hidden;
}
@media(min-width:440px){
  .phone{border-radius:34px;border:1px solid var(--line);box-shadow:0 40px 80px rgba(0,0,0,.55);}
}

/* header */
.hd{
  flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:16px 16px 13px;
  background:rgba(21,21,26,.78);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);
}
.back{color:var(--text2);font-size:22px;line-height:1;padding:2px 4px 4px 0;}
.avt{
  width:38px;height:38px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(135deg,#3b6cff,#9b4dff);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;
}
.hdtxt{min-width:0;}
.hdtxt .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdtxt .s{font-size:11.5px;color:var(--text3);margin-top:2px;letter-spacing:.03em;}
.hdtxt .s b{color:var(--red2);font-weight:500;}

/* scroll */
.scroll{flex:1 1 auto;overflow-y:auto;padding:18px 16px 22px;}
.scroll::-webkit-scrollbar{width:0;}
.sys{text-align:center;font-size:11.5px;color:var(--text3);line-height:1.75;margin:2px 0 18px;letter-spacing:.03em;}
.sys b{color:var(--text2);font-weight:400;}

/* record card */
.rec{
  background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--line);
  border-radius:16px;padding:13px 14px 14px;margin-bottom:11px;
  animation:pop .42s cubic-bezier(.2,.9,.25,1.05) both;
}
.rec .q{font-size:12.5px;color:var(--text2);display:flex;gap:8px;align-items:flex-start;margin-bottom:11px;line-height:1.5;}
.rec .q .n{
  font-size:10px;font-weight:700;color:var(--red2);flex:0 0 auto;margin-top:1px;
  border:1px solid rgba(255,45,74,.35);border-radius:5px;padding:1px 5px;letter-spacing:.06em;
}
.ans{display:flex;gap:9px;margin-top:8px;align-items:flex-start;}
.ans .who{font-size:10.5px;color:var(--text3);flex:0 0 46px;padding-top:4px;letter-spacing:.03em;}
.ans .txt{font-size:13.5px;line-height:1.6;background:var(--card2);border-radius:11px;padding:8px 11px;flex:1 1 auto;}
.ans.me .txt{background:rgba(255,45,74,.13);}

/* masked partner row */
.mask{
  flex:1 1 auto;border-radius:11px;padding:8px 11px;background:rgba(255,255,255,.035);
  border:1px dashed rgba(255,255,255,.11);
  font-size:12px;color:var(--text3);letter-spacing:.04em;
  display:flex;align-items:center;gap:8px;
}
.mask .bars{display:flex;gap:3px;}
.mask .bars i{
  display:block;width:13px;height:8px;border-radius:2px;background:rgba(255,255,255,.1);
  animation:sh 1.6s ease-in-out infinite;
}
.mask .bars i:nth-child(2){animation-delay:.2s;width:22px;}
.mask .bars i:nth-child(3){animation-delay:.4s;width:9px;}
@keyframes sh{0%,100%{opacity:.35}50%{opacity:.9}}

.open-in{animation:openIn .55s cubic-bezier(.25,.9,.3,1.05) both;}
@keyframes openIn{
  from{opacity:0;transform:translateY(6px) scaleY(.9);filter:blur(6px);}
  to{opacity:1;transform:none;filter:none;}
}
.hit{margin-top:10px;font-size:11.5px;color:var(--red2);letter-spacing:.04em;}

/* assist panel */
.panel{
  background:var(--card);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.1);border-radius:18px;
  padding:16px;margin-top:4px;position:relative;overflow:hidden;
}
.panel .ttl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);font-weight:600;margin-bottom:12px;}
.pmeta{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;}
.bignum{display:flex;align-items:baseline;gap:6px;}
.bignum b{
  font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--red),var(--red2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.bignum span{font-size:12px;color:var(--text3);letter-spacing:.06em;font-weight:500;}
.pips{display:flex;gap:5px;align-items:center;padding-bottom:4px;}
.pips i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.13);transition:all .3s;}
.pips i.done{background:rgba(255,45,74,.5);}
.pips i.now{background:var(--red2);transform:scale(1.45);}
.pnote{font-size:12px;color:var(--text2);line-height:1.7;margin-bottom:14px;}
.pnote b{color:var(--text);font-weight:500;}

.btn{
  width:100%;border:none;cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;
  font-size:14.5px;font-weight:600;letter-spacing:.02em;border-radius:12px;padding:13px;
  transition:transform .16s cubic-bezier(.2,.9,.3,1.3),opacity .2s;
}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.3;}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text2);font-weight:500;}

/* composer */
.cmp{
  flex:0 0 auto;display:flex;align-items:center;gap:9px;
  padding:11px 16px calc(11px + env(safe-area-inset-bottom));
  background:rgba(21,21,26,.8);backdrop-filter:blur(20px);border-top:1px solid var(--line);
}
.cmp .fake{flex:1 1 auto;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:20px;padding:10px 14px;font-size:13.5px;color:var(--text3);}
.cmp .snd{width:36px;height:36px;border-radius:50%;background:rgba(255,45,74,.16);color:var(--red2);display:flex;align-items:center;justify-content:center;font-size:15px;}

/* ---------- drawer ---------- */
.ovl{
  position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .32s;z-index:20;
}
.ovl.on{opacity:1;pointer-events:auto;}
.dw{
  position:absolute;left:0;right:0;bottom:0;z-index:21;
  background:rgba(24,24,30,.97);backdrop-filter:blur(24px);
  border-top:1px solid rgba(255,255,255,.1);
  border-radius:26px 26px 0 0;
  padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .42s cubic-bezier(.25,.9,.3,1);
  max-height:88%;overflow-y:auto;
}
.dw.on{transform:none;}
.dw::-webkit-scrollbar{width:0;}
.grip{width:38px;height:4px;border-radius:3px;background:rgba(255,255,255,.16);margin:0 auto 16px;}
.dwhd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;}
.qq{font-size:19px;font-weight:600;line-height:1.5;margin-bottom:6px;}
.hint{font-size:11.5px;color:var(--text3);line-height:1.6;margin-bottom:15px;}

textarea{
  width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;
  color:var(--text);font-family:inherit;font-size:14px;line-height:1.6;padding:11px 12px;
  resize:none;height:96px;outline:none;transition:border-color .2s;
}
textarea:focus{border-color:rgba(255,45,74,.5);}
textarea::placeholder{color:var(--text3);}

.grp{margin-bottom:16px;}
.glbl{font-size:11px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px;font-weight:600;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text2);
  font-family:inherit;font-size:13.5px;border-radius:11px;padding:9px 14px;cursor:pointer;
  transition:all .2s cubic-bezier(.2,.9,.3,1.2);
}
.chip.on{
  background:rgba(255,45,74,.16);border-color:rgba(255,45,74,.55);color:#fff;
  transform:translateY(-1px);
}
.dwfoot{margin-top:18px;}
.skip{
  width:100%;background:none;border:none;color:var(--text3);font-family:inherit;
  font-size:12.5px;padding:12px 0 2px;cursor:pointer;letter-spacing:.03em;
}
.donebox{text-align:center;padding:12px 4px 4px;}
.donebox .ico{font-size:30px;margin-bottom:12px;}
.donebox .big{font-size:19px;font-weight:600;margin-bottom:10px;}
.donebox p{font-size:13px;color:var(--text2);line-height:1.8;margin:0 0 17px;}

/* toast */
.toast{
  position:absolute;left:16px;right:16px;bottom:76px;z-index:15;
  background:rgba(38,38,46,.96);backdrop-filter:blur(20px);
  border:1px solid rgba(255,45,74,.3);border-radius:14px;
  padding:12px 14px;font-size:12.5px;color:var(--text);letter-spacing:.02em;
  opacity:0;transform:translateY(10px);pointer-events:none;transition:all .35s;
}
.toast.on{opacity:1;transform:none;}
.toast b{color:var(--red2);font-weight:600;}

/* dev */
.dev{position:absolute;top:9px;right:10px;z-index:30;}
.devbtn{
  background:rgba(0,0,0,.45);border:1px solid var(--line);color:var(--text3);
  font-family:inherit;font-size:10.5px;letter-spacing:.06em;border-radius:20px;
  padding:5px 10px;cursor:pointer;backdrop-filter:blur(10px);
}
.devbody{
  margin-top:7px;width:222px;padding:13px;border-radius:14px;
  background:rgba(20,20,26,.96);border:1px solid var(--line);backdrop-filter:blur(20px);display:none;
}
.devbody.on{display:block;}
.devbody .h{font-size:10px;letter-spacing:.12em;color:var(--text3);text-transform:uppercase;margin-bottom:10px;}
.sw{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.sw span{font-size:12px;color:var(--text2);line-height:1.4;}
.tog{width:38px;height:22px;border-radius:12px;background:rgba(255,255,255,.12);position:relative;flex:0 0 auto;cursor:pointer;transition:background .22s;}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--text2);transition:all .22s;}
.tog.on{background:rgba(255,45,74,.4);}
.tog.on::after{transform:translateX(16px);background:var(--red2);}
.devbody .mini{
  width:100%;background:transparent;border:1px solid var(--line);color:var(--text2);
  font-family:inherit;font-size:12px;border-radius:9px;padding:8px;cursor:pointer;margin-bottom:7px;
}

@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>

<div class="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div class="phone">
  <div class="dev">
    <button class="devbtn" id="devbtn">試す設定</button>
    <div class="devbody" id="devbody">
      <div class="h">プロトタイプ設定</div>
      <div class="sw">
        <span>相手が自動で<br>答えてくれる</span>
        <div class="tog on" id="togAuto"></div>
      </div>
      <button class="mini" id="one">相手の回答を1枚届ける</button>
      <button class="mini" id="all">相手の回答を全部届ける</button>
      <button class="mini" id="rst" style="margin-bottom:0;">最初からやり直す</button>
    </div>
  </div>

  <div class="hd">
    <div class="back">‹</div>
    <div class="avt">ユ</div>
    <div class="hdtxt">
      <div class="t">ばらの花 × ユキさん</div>
      <div class="s">セッションアシスト <b id="hdcnt">0 / 6</b></div>
    </div>
  </div>

  <div class="scroll" id="scroll">
    <div class="sys">
      ユキさんのセッションアンサーを承認しました。<br>
      <b>セッションアシストで、会う日までの話を進めましょう。</b>
    </div>
    <div id="records"></div>
    <div class="panel" id="panel"></div>
  </div>

  <div class="cmp">
    <div class="fake">メッセージを入力</div>
    <div class="snd">↑</div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="ovl" id="ovl"></div>
  <div class="dw" id="dw"><div class="grip"></div><div id="dwbody"></div></div>
</div>

<script>
/* ============ デッキ ============ */
const DECK = [
  { q:"パートと音楽歴を教えて",
    hint:"パートは複数選べます",
    type:"profile",
    parts:["Vo","Gt","Ba","Dr","Key","その他"],
    years:["はじめたばかり","1〜3年","3年以上","だいぶ長い"],
    mine:{parts:["Vo","Gt"],years:"1〜3年"},
    them:"Dr ・ 1〜3年" },

  { q:"この曲のどこが好き？",
    hint:"《ばらの花》について。ひとことでも",
    type:"text",
    mine:"イントロのギターが好きで、そこだけ何回も聴いてます",
    them:"サビ前の静かなとこ。あの歌詞にやられました" },

  { q:"セッションへの意気込みは？",
    hint:"気負わずどうぞ",
    type:"text",
    mine:"初セッションで緊張してますが、よろしくお願いします！",
    them:"人と合わせるの久しぶりなので楽しみです。ゆるっとやりましょう" },

  { q:"他にセッションしてみたい曲は？",
    hint:"何曲でも",
    type:"text",
    mine:"スピッツの「楓」もやってみたいです",
    them:"スピッツ「楓」とか、くるりの他の曲も" },

  { q:"スタジオ使ったことある？どのへん？",
    hint:"駅名だけでもOK",
    type:"text",
    mine:"新宿ならいけます。スタジオはまだ数回だけ",
    them:"新宿・高田馬場あたり。駅近のスタジオよく使います" },

  { q:"動きやすいのはどのへん？",
    hint:"複数えらべます",
    type:"multi",
    options:["平日夜","週末昼","週末夜"],
    mine:["週末昼"],
    them:"週末昼" }
];

const HITWORDS = ["楓","スピッツ","くるり","新宿","高田馬場","週末昼","1〜3年"];

/* ============ 状態 ============ */
let mine = new Array(DECK.length).fill(null);   // 自分の回答
let open = new Array(DECK.length).fill(false);  // 相手が答えて開いたか
let dIdx = 0;          // ドロワーで今見てるカード
let auto = true;       // 相手が自動で答える
let timers = [];
const recEls = {};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============ 回答テキスト化 ============ */
function mineText(i){
  const m = mine[i]; if(m===null) return "";
  if(DECK[i].type==="profile") return m.parts.join(" / ") + " ・ " + m.years;
  if(DECK[i].type==="multi")   return m.join(" / ");
  return m;
}
function hit(i){
  if(!open[i] || mine[i]===null) return null;
  const a = mineText(i), b = DECK[i].them;
  for(const w of HITWORDS){ if(a.includes(w) && b.includes(w)) return w; }
  return null;
}

/* ============ チャット側の記録 ============ */
function partnerRow(i){
  if(open[i]){
    const h = hit(i);
    return `<div class="ans open-in"><div class="who">ユキさん</div>
        <div class="txt">${esc(DECK[i].them)}</div></div>
      ${ h ? `<div class="hit open-in">🎯 「${esc(h)}」が2人とも出てきました</div>` : `` }`;
  }
  return `<div class="ans"><div class="who">ユキさん</div>
      <div class="mask"><span class="bars"><i></i><i></i><i></i></span>回答まち</div></div>`;
}
function addRecord(i){
  const el = document.createElement('div');
  el.className = 'rec';
  el.innerHTML = `
    <div class="q"><span class="n">${i+1}</span>${esc(DECK[i].q)}</div>
    <div class="ans me"><div class="who">あなた</div><div class="txt">${esc(mineText(i))}</div></div>
    <div class="pt">${partnerRow(i)}</div>`;
  recEls[i] = el;
  $('records').appendChild(el);
}
function refreshPartner(i){
  if(!recEls[i]) return;
  recEls[i].querySelector('.pt').innerHTML = partnerRow(i);
}

/* ============ アシストパネル ============ */
function renderPanel(){
  const done = mine.filter(v=>v!==null).length;
  const opened = open.filter(Boolean).length;
  $('hdcnt').textContent = done + " / " + DECK.length;

  let pips = "";
  for(let k=0;k<DECK.length;k++){
    pips += `<i class="${ mine[k]!==null ? 'done' : (k===firstUnanswered() ? 'now' : '') }"></i>`;
  }

  let note, label;
  if(done === 0){
    note = `音楽の話から、会う場所と時間まで。<b>6枚のお題</b>を、自分のペースで答えられます。<br>相手の回答は、お互い答えたカードから順に開きます。`;
    label = "セッションアシストを始める";
  }else if(done < DECK.length){
    note = `あと<b>${DECK.length-done}枚</b>。相手を待たずに進められます。<br>ひらいたカード <b>${opened} / ${DECK.length}</b>`;
    label = "つづきに答える";
  }else if(opened < DECK.length){
    note = `6枚ぜんぶ答えました。<br>ユキさんが答えたカードから順にひらきます。<br>ひらいたカード <b>${opened} / ${DECK.length}</b>`;
    label = "答えを見直す";
  }else{
    const t = timeOverlap();
    note = `6枚ぜんぶひらきました。<br>
      時間：${ t ? `2人とも <b>${esc(t)}</b> を選びました` : `重なった時間帯はありませんでした` }<br>
      場所：あなた「<b>${esc(mineText(4))}</b>」<br>
      　　　ユキさん「<b>${esc(DECK[4].them)}</b>」`;
    label = "この内容で候補を出す";
  }

  $('panel').innerHTML = `
    <div class="ttl">セッションアシスト</div>
    <div class="pmeta">
      <div class="bignum"><b>${done}</b><span>/ ${DECK.length}</span></div>
      <div class="pips">${pips}</div>
    </div>
    <div class="pnote">${note}</div>
    <button class="btn" id="pbtn">${label}</button>`;

  $('pbtn').onclick = () => {
    if(done===DECK.length && opened===DECK.length){
      $('pbtn').textContent = "（日程調整はこの先で設計）";
      $('pbtn').disabled = true;
      return;
    }
    dIdx = firstUnanswered() === -1 ? 0 : firstUnanswered();
    openDrawer();
  };
}
/* 時間帯だけは自動で突き合わせる（集合演算） */
function timeOverlap(){
  if(mine[5]===null) return null;
  const them = DECK[5].them.split(/[\/、,・]/).map(s=>s.trim());
  const hitv = mine[5].filter(v => them.includes(v));
  return hitv.length ? hitv.join(" / ") : null;
}

function firstUnanswered(){
  for(let k=0;k<DECK.length;k++) if(mine[k]===null) return k;
  return -1;
}

/* ============ ドロワー ============ */
function openDrawer(){ renderDrawer(); $('ovl').classList.add('on'); $('dw').classList.add('on'); }
function closeDrawer(){ $('ovl').classList.remove('on'); $('dw').classList.remove('on'); }

let tmpParts = [], tmpYears = null, tmpMulti = [];

function renderDrawer(){
  const c = DECK[dIdx];
  let pips = "";
  for(let k=0;k<DECK.length;k++){
    pips += `<i class="${ mine[k]!==null ? 'done' : (k===dIdx ? 'now' : '') }"></i>`;
  }
  let body = "";

  if(c.type==="profile"){
    tmpParts = mine[dIdx] ? [...mine[dIdx].parts] : [...c.mine.parts];
    tmpYears = mine[dIdx] ? mine[dIdx].years : c.mine.years;
    body = `
      <div class="grp"><div class="glbl">パート（複数可）</div><div class="chips" id="cp">
        ${c.parts.map(p=>`<button class="chip ${tmpParts.includes(p)?'on':''}" data-p="${p}">${p}</button>`).join("")}
      </div></div>
      <div class="grp"><div class="glbl">音楽歴</div><div class="chips" id="cy">
        ${c.years.map(y=>`<button class="chip ${tmpYears===y?'on':''}" data-y="${y}">${y}</button>`).join("")}
      </div></div>`;
  }else if(c.type==="multi"){
    tmpMulti = mine[dIdx] ? [...mine[dIdx]] : [...c.mine];
    body = `<div class="grp"><div class="chips" id="cm">
        ${c.options.map(o=>`<button class="chip ${tmpMulti.includes(o)?'on':''}" data-m="${o}">${o}</button>`).join("")}
      </div></div>`;
  }else{
    body = `<textarea id="ta" placeholder="ここに書く">${esc(mine[dIdx]!==null ? mine[dIdx] : c.mine)}</textarea>`;
  }

  const last = dIdx === DECK.length-1;
  $('dwbody').innerHTML = `
    <div class="dwhd">
      <div class="bignum"><b>${dIdx+1}</b><span>/ ${DECK.length}</span></div>
      <div class="pips">${pips}</div>
    </div>
    <div class="qq">${esc(c.q)}</div>
    <div class="hint">${esc(c.hint)}</div>
    ${body}
    <div class="dwfoot">
      <button class="btn" id="sub">${ last ? "答え終わった" : "答えて次へ" }</button>
      <button class="skip" id="cls">あとにする</button>
    </div>`;

  const cp = $('cp'); if(cp) cp.onclick = e => {
    const b = e.target.closest('.chip'); if(!b) return;
    const p = b.dataset.p;
    tmpParts.includes(p) ? tmpParts = tmpParts.filter(x=>x!==p) : tmpParts.push(p);
    b.classList.toggle('on');
  };
  const cy = $('cy'); if(cy) cy.onclick = e => {
    const b = e.target.closest('.chip'); if(!b) return;
    tmpYears = b.dataset.y;
    [...cy.children].forEach(x=>x.classList.toggle('on', x===b));
  };
  const cm = $('cm'); if(cm) cm.onclick = e => {
    const b = e.target.closest('.chip'); if(!b) return;
    const m = b.dataset.m;
    tmpMulti.includes(m) ? tmpMulti = tmpMulti.filter(x=>x!==m) : tmpMulti.push(m);
    b.classList.toggle('on');
  };

  $('cls').onclick = closeDrawer;
  $('sub').onclick = submit;
}

function submit(){
  const c = DECK[dIdx];
  let val;
  if(c.type==="profile"){
    if(!tmpParts.length || !tmpYears) return;
    val = { parts:[...tmpParts], years:tmpYears };
  }else if(c.type==="multi"){
    if(!tmpMulti.length) return;
    val = [...tmpMulti];
  }else{
    val = $('ta').value.trim(); if(!val) return;
  }
  const isNew = mine[dIdx] === null;
  mine[dIdx] = val;
  if(isNew){ addRecord(dIdx); scheduleThem(dIdx); }
  renderPanel();

  if(dIdx < DECK.length-1){
    dIdx++;
    renderDrawer();
    $('dw').scrollTop = 0;
  }else{
    closeDrawer();
    setTimeout(()=> $('scroll').scrollTop = $('scroll').scrollHeight, 300);
  }
}

/* ============ 相手の回答が届く ============ */
function scheduleThem(i){
  if(!auto) return;
  const t = setTimeout(()=> reveal(i), 4000 + Math.random()*6000);
  timers.push(t);
}
function reveal(i){
  if(open[i] || mine[i]===null) return;
  open[i] = true;
  refreshPartner(i);
  renderPanel();
  const drawerOpen = $('dw').classList.contains('on');
  toast(`<b>${i+1}枚目</b>がひらきました　ユキさんが答えました`, drawerOpen);
}
function toast(html, quiet){
  const t = $('toast');
  t.innerHTML = html;
  t.style.bottom = quiet ? "auto" : "76px";
  t.style.top = quiet ? "72px" : "auto";
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove('on'), 2600);
}

/* ============ dev ============ */
$('devbtn').onclick = () => $('devbody').classList.toggle('on');
$('togAuto').onclick = e => { auto = !auto; e.currentTarget.classList.toggle('on', auto); };
$('one').onclick = () => {
  for(let k=0;k<DECK.length;k++) if(mine[k]!==null && !open[k]){ reveal(k); return; }
};
$('all').onclick = () => {
  for(let k=0;k<DECK.length;k++) if(mine[k]!==null && !open[k]) reveal(k);
};
$('rst').onclick = reset;
$('ovl').onclick = closeDrawer;

function reset(){
  timers.forEach(clearTimeout); timers = [];
  mine = new Array(DECK.length).fill(null);
  open = new Array(DECK.length).fill(false);
  Object.keys(recEls).forEach(k=>delete recEls[k]);
  dIdx = 0;
  $('records').innerHTML = "";
  closeDrawer();
  renderPanel();
  $('scroll').scrollTop = 0;
}

renderPanel();
</script>
</body>
</html>
