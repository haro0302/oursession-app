<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>our-SESSION</title>
<meta name="theme-color" content="#0a0a0b">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0a0b;
  --row:#1a1a1c;          /* プレイヤー行 */
  --row-hi:#232326;       /* 展開時 */
  --tile:#161618;         /* おすすめタイル */
  --line:rgba(255,255,255,.07);
  --ink:#ffffff;
  --muted:#8e8e94;
  --dim:#5b5b62;
  --accent:#ff5e3a;
  --accent-lit:#ff8a5c;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg) !important;min-height:100%;color-scheme:dark}
body{
  background:var(--bg) !important;color:var(--ink);
  font-family:"Inter","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",YuGothic,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.backdrop{position:fixed;inset:0;background:var(--bg);z-index:-1;pointer-events:none}

.inner{width:100%;max-width:390px;margin:0 auto;padding:32px 16px 124px}

/* ══ スライドインするパネル（さがす・絞り込み） ══
   画面外に固定して滑り込ませる。ページ側に横幅を
   持たせないので、本体がぐらつかない。
   ══════════════════════════════════════════ */
.panel{
  position:fixed;inset:0;z-index:40;background:var(--bg);
  transform:translateX(100%);visibility:hidden;
  transition:transform .42s cubic-bezier(.32,.72,0,1),visibility 0s .42s;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.panel.show{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.32,.72,0,1)}
.ptop{display:flex;align-items:center;gap:12px}
.ptitle{font-size:17px;font-weight:700;letter-spacing:-.01em}
.psub{margin-top:6px;font-size:12.5px;color:var(--muted)}

/* ── header ── */
.top{display:flex;align-items:center;justify-content:space-between}
.logo{width:126px;height:36.9px;display:block}
.iconbtn{
  width:44px;height:44px;border-radius:50%;flex:none;
  border:1px solid var(--line);display:grid;place-items:center;
  color:var(--ink);font-size:20px;
  transition:background .18s;
}
.iconbtn:active{transform:scale(.93)}

/* ── おすすめ 2×2 ── */
.picks{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{
  display:flex;align-items:center;gap:11px;
  background:var(--tile);border-radius:14px;padding:9px 12px 9px 9px;
  text-align:left;min-width:0;
  transition:background .18s,transform .12s;
}
.pick:active{transform:scale(.975)}
.pick .ic{
  width:42px;height:42px;border-radius:11px;flex:none;
  display:grid;place-items:center;font-size:20px;color:#fff;
}
.pick .tx{
  font-size:13px;font-weight:600;line-height:1.25;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ══ プレイヤー行 ══════════════════════════ */
.feed{margin-top:24px;display:flex;flex-direction:column;gap:10px}

.pl{
  position:relative;isolation:isolate;overflow:hidden;
  width:100%;text-align:left;display:block;
  background:var(--row);border:1px solid var(--line);border-radius:20px;
  transition:background .4s,border-color .4s;
}
.pl.open{background:var(--row-hi);border-color:rgba(255,255,255,.12)}

/* 上段（常に見える行） */
.head{
  position:relative;z-index:2;cursor:pointer;
  display:flex;align-items:center;gap:12px;
  padding:13px 14px;
}
.thumb{
  position:relative;width:60px;height:60px;border-radius:16px;flex:none;overflow:hidden;
  background:#26262a;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.wip{
  height:20px;padding:0 8px;display:inline-flex;align-items:center;flex:none;
  border-radius:10px;border:1px solid var(--line-hi);background:rgba(255,255,255,.07);
  font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap;
}
.hmeta{flex:1;min-width:0}
.htitle{
  font-size:16px;font-weight:600;line-height:1.3;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hsub{
  margin-top:5px;display:flex;align-items:center;gap:8px;min-width:0;
  font-size:12.5px;color:var(--muted);
}
.wchip{
  height:24px;padding:0 9px;display:inline-flex;align-items:center;gap:6px;flex:none;
  border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  font-size:11.5px;white-space:nowrap;
}
.wchip .k{color:var(--dim);font-weight:500;font-size:10.5px}
.wchip .v{color:var(--muted);font-weight:600}
.wchip.song .v{color:var(--ink)}
.hart{
  font-size:13px;color:var(--muted);min-width:0;flex:0 1 auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pl.open .wchip{border-color:rgba(255,255,255,.16)}
.pl.open .wchip .v{color:var(--ink)}

/* 畳んだ状態の波形 */
.rowwave{
  position:relative;z-index:2;display:flex;align-items:center;gap:11px;
  padding:0 14px 13px;
}
.bars{
  flex:1;min-width:0;height:30px;display:flex;align-items:center;gap:2px;
  touch-action:pan-y;cursor:pointer;
}
.bars span{flex:1;min-width:0;border-radius:1.5px;background:#3d3d45;transition:background .1s}
.bars span.on{background:var(--accent)}
.rowdur{flex:none;font-size:11.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.rowplay{
  width:34px;height:34px;border-radius:50%;flex:none;
  background:rgba(255,255,255,.1);display:grid;place-items:center;
  transition:background .2s,transform .12s;
}
.rowplay:active{transform:scale(.9)}
.pl.playing .rowplay{background:var(--accent)}
.rowplay i{
  display:block;width:0;height:0;margin-left:2.5px;
  border-left:11px solid #fff;
  border-top:6.5px solid transparent;border-bottom:6.5px solid transparent;
}
.pl.playing .rowplay i{
  width:10px;height:12px;border:0;margin-left:0;
  background:linear-gradient(90deg,#fff 0 3.5px,transparent 3.5px 6.5px,#fff 6.5px 10px);
}
/* 上半分をタップで詳細、という手がかり */
.hcv{
  flex:none;color:var(--dim);font-size:15px;line-height:1;
  transition:transform .3s,color .2s;
}
.pl.open .hcv{transform:rotate(180deg);color:var(--muted)}

/* 展開部 */
.detail{
  position:relative;z-index:2;
  display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .44s cubic-bezier(.32,.72,0,1);
}
.pl.open .detail{grid-template-rows:1fr}
.dwrap{overflow:hidden;min-height:0}
.dpad{
  padding:2px 16px 16px;
  opacity:0;transform:translateY(6px);
  transition:opacity .3s .1s,transform .34s .1s;
}
.pl.open .dpad{opacity:1;transform:none}

.dbody{font-size:13.5px;line-height:21px;color:#c4c4ca}
.dwho{margin-top:15px;display:flex;align-items:center;gap:8px;min-width:0}
.dwho .av{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:none}
.dwho .av img{width:100%;height:100%;object-fit:cover;display:block}
.dname{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlevel{
  height:20px;padding:0 8px;flex:none;display:inline-flex;align-items:center;border-radius:6px;
  background:rgba(255,255,255,.07);color:var(--muted);font-size:10.5px;font-weight:600;
}
.dacts{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
.dact{color:var(--muted);padding:6px;transition:color .2s,transform .15s}
.dact.save{font-size:20px}
.dact.dots{font-size:17px}
.dact[aria-pressed="true"]{color:var(--ink)}
.dact:active{transform:scale(.85)}
.dtags{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.dtag{
  height:29px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;
  border-radius:14px;background:rgba(255,255,255,.06);
  font-size:12px;white-space:nowrap;
}
.dtag .k{color:var(--dim);font-size:11px;font-weight:500}
.dtag .v{color:var(--ink);font-weight:600}
.dtag.song{border-color:var(--line-hi);background:rgba(255,255,255,.075)}
.dcta{
  margin-top:16px;width:100%;height:48px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--accent);border-radius:24px;
  color:#fff;font-size:14px;font-weight:700;
  transition:transform .12s,filter .18s;
}
.dcta svg{font-size:18px}
.dcta:active{transform:translateY(1px);filter:brightness(1.06)}

#panelBody .feed,#panelBody > *{margin-top:22px}
.pempty{margin-top:40px;font-size:13px;color:var(--dim);text-align:center}

/* ── dock ── */
.dock{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom));
  width:266px;height:62px;
  background:rgba(26,26,28,.88);
  -webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);
  border:1px solid var(--line);border-radius:31px;
  box-shadow:0 14px 34px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;gap:14px;z-index:30;
}
.nav{
  width:46px;height:46px;border-radius:50%;flex:none;
  display:grid;place-items:center;color:var(--muted);
  transition:background .18s,color .18s;
}
.nav[aria-current="page"]{background:var(--accent);color:#fff}
.nav:active{transform:scale(.92)}
.nav.home svg{font-size:24px}.nav.plus svg{font-size:27px}
.nav.msg svg{font-size:21px}.nav.me svg{font-size:20px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    part:'ドラム', area:'大阪', genre:'ロック'
  }
];

const cover = i => AVATARS[i % AVATARS.length];
const mmss = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

/* 畳んだ行に出す静的な波形（実装時は音源の解析値）*/
const WAVE = seed => Array.from({length:46}, (_,i) => {
  const u = i/46;
  const env = Math.sin(Math.PI * Math.min(1, u*1.1));
  const g = Math.abs(Math.sin(i*1.7+seed) + Math.sin(i*.41+seed*2))/2;
  return Math.max(3, Math.round((4 + g*22) * (.3 + env*.7)));
});

/* ── おすすめタイル ── */
document.getElementById('picks').innerHTML = picks.map((p,i) => `
  <button class="pick" data-pick="${i}">
    <span class="ic" style="background:${p.g}"><svg width="1em" height="1em"><use href="#${p.icon}"/></svg></span>
    <span class="tx">${p.label}</span>
  </button>`).join('');

/* ── プレイヤー行（タイムラインとパネルで共用）── */
const rowHTML = (p,i) => `
<article class="pl" data-i="${i}" style="--p:0%">
  <div class="head" role="button" tabindex="0" aria-expanded="false">
    <div class="thumb"><img src="${cover(i)}" alt=""></div>
    <div class="hmeta">
      <p class="htitle">${p.song}</p>
      <p class="hsub">
        <span class="hart">${p.artist}</span>
        ${p.wip?'<span class="wip">まだ練習中</span>':''}
      </p>
    </div>
    <span class="hcv" aria-hidden="true">⌄</span>
  </div>

  <div class="rowwave">
    <button class="rowplay" aria-label="再生"><i></i></button>
    <div class="bars" role="slider" tabindex="0" aria-label="再生位置"
         aria-valuemin="0" aria-valuemax="${p.dur}" aria-valuenow="0">
      ${WAVE(p.seed).map(h=>`<span style="height:${h}px"></span>`).join('')}
    </div>
    <span class="rowdur">${mmss(p.dur)}</span>
  </div>

  <div class="detail">
    <div class="dwrap"><div class="dpad">
      <p class="dbody">${p.body}</p>
      <div class="dwho">
        <span class="av"><img src="${cover(i)}" alt=""></span>
        <span class="dname">${p.name}</span>
        <span class="dacts">
          <button class="dact save" aria-pressed="false" aria-label="保存"><svg width="1em" height="1em"><use href="#i-bm-o"/></svg></button>
          <button class="dact dots" aria-label="その他"><svg width="1em" height="1em"><use href="#i-dots"/></svg></button>
        </span>
      </div>
      <div class="dtags">
        <span class="dtag"><span class="k">募集パート</span><span class="v">${p.part}</span></span>
        <span class="dtag"><span class="k">エリア</span><span class="v">${p.area}</span></span>
        <span class="dtag"><span class="k">ジャンル</span><span class="v">${p.genre}</span></span>
      </div>
      <button class="dcta"><svg width="1em" height="1em"><use href="#i-send"/></svg>セッションアンサーを送る</button>
    </div></div>
  </div>
</article>`;

document.getElementById('feed').innerHTML = posts.map(rowHTML).join('');

/* ══ 再生（音源が無いのでタイマーで代用） ══ */
let cur = null, timer = null;

function paintRow(pl, time){
  const p = posts[+pl.dataset.i];
  const pct = Math.max(0, Math.min(1, time/p.dur));
  pl.style.setProperty('--p', (pct*100).toFixed(1)+'%');
  pl.dataset.time = time;
  const bars = pl.querySelectorAll('.bars span');
  const n = Math.round(pct * bars.length);
  bars.forEach((b,i) => b.classList.toggle('on', i < n));
  const bx = pl.querySelector('.bars');
  if (bx) bx.setAttribute('aria-valuenow', time.toFixed(0));
}

function collapse(pl){
  if (!pl) return;
  pl.classList.remove('open');
  pl.querySelector('.head').setAttribute('aria-expanded','false');
}

function expand(pl){
  document.querySelectorAll('.pl.open').forEach(o => { if (o !== pl) collapse(o); });
  pl.classList.add('open');
  pl.querySelector('.head').setAttribute('aria-expanded','true');
}

function stopPlay(){
  if (!cur) return;
  clearInterval(timer);
  const was = cur;
  cur = null;
  was.classList.remove('playing');
}

function startPlay(pl, from){
  if (cur && cur !== pl) stopPlay();
  const p = posts[+pl.dataset.i];
  cur = pl;
  pl.classList.add('playing');
  let t = from || 0;
  paintRow(pl, t);
  clearInterval(timer);
  timer = setInterval(() => {
    t += 0.1;
    if (t >= p.dur){ paintRow(pl, 0); stopPlay(); return; }
    paintRow(pl, t);
  }, 100);
}



/* 上段タップで開閉。展開中は下部（CTA周辺）では閉じない */
document.addEventListener('click', e => {
  const cta = e.target.closest('.dcta');
  if (cta){ e.stopPropagation(); return; }

  const sv = e.target.closest('.dact.save');
  if (sv){
    e.stopPropagation();
    const on = sv.getAttribute('aria-pressed') === 'true';
    sv.setAttribute('aria-pressed', String(!on));
    sv.querySelector('use').setAttribute('href', on ? '#i-bm-o' : '#i-bm');
    return;
  }
  if (e.target.closest('.dact')){ e.stopPropagation(); return; }

  const rp = e.target.closest('.rowplay');
  if (rp){
    const pl = rp.closest('.pl');
    cur === pl ? stopPlay() : startPlay(pl, parseFloat(pl.dataset.time || 0));
    return;
  }

  const head = e.target.closest('.head');
  if (head){
    const pl = head.closest('.pl');
    pl.classList.contains('open') ? collapse(pl) : expand(pl);
    return;
  }

  const pick = e.target.closest('.pick');
  if (pick){
    const q = picks[+pick.dataset.pick];
    const hits = posts.map((p,i)=>[p,i]).filter(([p]) => p.part === q.match);
    openPanel(q.label, `${hits.length}件のセッション`,
      hits.length ? hits.map(([p,i]) => rowHTML(p,i)).join('')
                  : '<p class="pempty">まだ投稿がありません</p>');
    return;
  }

  if (e.target.closest('#toSearch')){
    openPanel('さがす', '曲名・アーティスト・パートで',
      '<p class="pempty">検索画面は後で組みます</p>');
    return;
  }
  if (e.target.closest('#panelBack')){ closePanel(); return; }

  const nav = e.target.closest('.nav');
  if (nav){
    document.querySelectorAll('.nav').forEach(n => n.removeAttribute('aria-current'));
    nav.setAttribute('aria-current','page');
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const sv = e.target.closest('.dact.save');
  if (sv){
    e.stopPropagation();
    const on = sv.getAttribute('aria-pressed') === 'true';
    sv.setAttribute('aria-pressed', String(!on));
    sv.querySelector('use').setAttribute('href', on ? '#i-bm-o' : '#i-bm');
    return;
  }
  if (e.target.closest('.dact')){ e.stopPropagation(); return; }

  const head = e.target.closest('.head');
  if (!head) return;
  e.preventDefault();
  const pl = head.closest('.pl');
  pl.classList.contains('open') ? collapse(pl) : expand(pl);
});

/* 畳んだ行の波形をドラッグしてシーク */
let dragRow = null;
function seekRow(pl, clientX){
  const p = posts[+pl.dataset.i];
  const r = pl.querySelector('.bars').getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  const t = pct * p.dur;
  paintRow(pl, t);
  return t;
}
document.addEventListener('pointerdown', e => {
  const bars = e.target.closest('.bars');
  if (!bars) return;
  dragRow = bars.closest('.pl');
  bars.setPointerCapture(e.pointerId);
  seekRow(dragRow, e.clientX);
});
document.addEventListener('pointermove', e => { if (dragRow) seekRow(dragRow, e.clientX); });
document.addEventListener('pointerup', e => {
  if (!dragRow) return;
  const t = seekRow(dragRow, e.clientX);
  if (cur === dragRow) startPlay(dragRow, t);
  dragRow = null;
});

/* ── パネル ── */
const panel = document.getElementById('panel');

function openPanel(title, sub, html){
  stopPlay();
  document.querySelectorAll('.pl.open').forEach(collapse);
  document.getElementById('panelTitle').textContent = title;
  document.getElementById('panelSub').textContent = sub;
  document.getElementById('panelBody').innerHTML = html;
  panel.classList.add('show');
  panel.setAttribute('aria-hidden','false');
  panel.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

function closePanel(){
  stopPlay();
  document.querySelectorAll('.pl.open').forEach(collapse);
  panel.classList.remove('show');
  panel.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
}

addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
</script>
</body>
